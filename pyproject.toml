[project]
name = "pydantic-cc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kapil Singh Negi", email = "124447041+kapilsinghnegi@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
pydantic-cc = "pydantic_cc:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
